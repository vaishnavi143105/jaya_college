<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Users — MissVoice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --border-color: #334155;
            --accent: #38BDF8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --success: #10B981;
            --danger: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        aside {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .logo i { color: var(--accent); }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.8rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-item.active a, .nav-item a:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        main {
            margin-left: 260px;
            flex: 1;
            padding: 2.5rem;
            max-width: 800px;
        }

        .search-header { margin-bottom: 2rem; }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .search-bar input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .search-bar input:focus { border-color: var(--accent); }

        .btn-search {
            background: var(--accent);
            color: #0F172A;
            border: none;
            padding: 0 1.75rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-search:hover { opacity: 0.9; }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 2rem;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--accent);
            color: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .btn-connect {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-connect:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }
        .status-msg.error { color: var(--danger); display: block; }
        .status-msg.success { color: var(--success); display: block; }
    </style>
</head>
<body>
    <aside>
        <a href="dashboard.html" class="logo"><i class="fa-solid fa-hands-asl-interpreting"></i> MISSVOICE</a>
        <ul class="nav-menu">
            <li class="nav-item"><a href="dashboard.html"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
            <li class="nav-item active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search User</a></li>
            <li class="nav-item"><a href="connection.html"><i class="fa-solid fa-user-group"></i> Connections</a></li>
            <li class="nav-item"><a href="chat.html"><i class="fa-solid fa-comments"></i> Messages</a></li>
            <li class="nav-item"><a href="translate.html"><i class="fa-solid fa-hands"></i> Test AI Sign</a></li>
            <li class="nav-item"><a href="setting.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
        </ul>
    </aside>

    <main>
        <div class="search-header">
            <h1>Search by MissVoice ID</h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Find friends using their unique MissVoice tag (e.g. <code>@breshma_2984</code>)</p>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Enter exact ID (e.g. @breshma_2984)">
                <button class="btn-search" onclick="executeSearch()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>
            <div id="searchStatus" class="status-msg"></div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="user-meta">
                <div class="avatar" id="resAvatar">U</div>
                <div>
                    <h3 id="resName">User Name</h3>
                    <div style="color: var(--accent); font-weight: 600;" id="resId">@id</div>
                </div>
            </div>
            <button class="btn-connect" id="connectBtn" onclick="sendConnect()"><i class="fa-solid fa-user-plus"></i> Connect</button>
        </div>

        <p id="noResult" style="color: var(--text-muted); text-align: center; margin-top: 3rem; display: none;">No user found with that MissVoice ID.</p>
    </main>

    <script>
        const myId = localStorage.getItem('missvoice_id');
        if (!myId) window.location.href = 'login.html';

        let currentTargetId = '';

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') executeSearch();
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('q')) {
            document.getElementById('searchInput').value = urlParams.get('q');
            executeSearch();
        }

        async function executeSearch() {
            let query = document.getElementById('searchInput').value.trim();
            const resCard = document.getElementById('resultCard');
            const noResult = document.getElementById('noResult');
            const statusMsg = document.getElementById('searchStatus');

            statusMsg.className = 'status-msg';
            resCard.style.display = 'none';
            noResult.style.display = 'none';

            if (!query) return;
            if (!query.startsWith('@')) query = '@' + query;

            try {
                const res = await fetch(`/api/users/search?query=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error('User not found');
                const user = await res.json();

                currentTargetId = user.missvoice_id;
                document.getElementById('resName').innerText = user.name;
                document.getElementById('resId').innerText = user.missvoice_id;
                document.getElementById('resAvatar').innerText = (user.name || 'U')[0].toUpperCase();

                const btn = document.getElementById('connectBtn');
                if (currentTargetId === myId) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-user"></i> You';
                    btn.style.background = '#475569';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Connect';
                    btn.style.background = 'var(--success)';
                }

                resCard.style.display = 'flex';
            } catch (err) {
                noResult.style.display = 'block';
            }
        }

        async function sendConnect() {
            const btn = document.getElementById('connectBtn');
            const statusMsg = document.getElementById('searchStatus');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

            try {
                const res = await fetch('/api/connections/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        sender_id: myId, 
                        receiver_id: currentTargetId 
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Request Sent';
                    btn.style.background = '#475569';
                    statusMsg.innerText = `Connection request sent to ${currentTargetId}!`;
                    statusMsg.className = 'status-msg success';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Connect';
                    statusMsg.innerText = data.error || data.message || data.detail || 'Failed to send request';
                    statusMsg.className = 'status-msg error';
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Connect';
                statusMsg.innerText = 'Network error while sending request.';
                statusMsg.className = 'status-msg error';
            }
        }
    </script>
</body>
</html>
