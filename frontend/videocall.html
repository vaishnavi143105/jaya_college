<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call — MissVoice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --accent: #38BDF8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --danger: #EF4444;
            --success: #10B981;
            --text-main: #F8FAFC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .call-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1.5rem; position: relative; }
        .video-box { position: relative; background: #000; border-radius: 16px; overflow: hidden; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-label { position: absolute; top: 1rem; left: 1rem; background: rgba(15, 23, 42, 0.85); padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; z-index: 10; border: 1px solid #334155; }
        .mode-status-badge { position: absolute; top: 1rem; right: 1rem; background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid #10B981; padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; z-index: 10; }

        .caption-overlay {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--accent);
            color: #38BDF8;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: none;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
            z-index: 20;
            text-align: center;
            max-width: 85%;
            word-wrap: break-word;
            white-space: normal;
        }

        .control-bar {
            height: 85px;
            background: var(--bg-card);
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
        }

        .btn-ctrl {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: #334155;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-ctrl:hover { opacity: 0.9; }
        .btn-sign { background: #334155; width: auto; border-radius: 26px; padding: 0 1.3rem; gap: 0.5rem; font-weight: 700; font-size: 0.95rem; }
        .btn-sign.active { background: var(--accent); color: #0F172A; box-shadow: 0 0 15px var(--accent-glow); }
        .btn-hangup { background: var(--danger); }

        .lang-select-wrapper {
            display: flex;
            align-items: center;
            background: #334155;
            border-radius: 26px;
            padding: 0 0.8rem;
            border: 1px solid #475569;
        }
        .lang-select-wrapper i { color: var(--accent); margin-right: 0.4rem; font-size: 0.9rem; }
        .lang-select {
            background: transparent;
            color: #F8FAFC;
            border: none;
            outline: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.7rem 0.2rem;
            cursor: pointer;
        }
        .lang-select option { background: #1E293B; color: #F8FAFC; }
    </style>
</head>
<body>

    <div class="call-container">
        <!-- Local Video -->
        <div class="video-box">
            <span class="video-label" id="localLabel">You</span>
            <span class="mode-status-badge" id="modeBadge">VOICE / STT ACTIVE</span>
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="caption-overlay" id="localCaption"></div>
        </div>

        <!-- Remote Video -->
        <div class="video-box">
            <span class="video-label" id="remoteLabel">Connecting to peer...</span>
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="caption-overlay" id="remoteCaption"></div>
        </div>
    </div>

    <canvas id="signCanvas" style="display: none;"></canvas>

    <div class="control-bar">
        <button class="btn-ctrl" id="micBtn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i></button>
        <button class="btn-ctrl" id="camBtn" onclick="toggleCam()"><i class="fa-solid fa-video"></i></button>
        
        <button class="btn-ctrl btn-sign" id="signBtn" onclick="toggleSignRecognition()">
            <i class="fa-solid fa-hands-asl-interpreting"></i> <span id="signText">SIGN: OFF</span>
        </button>

        <div class="lang-select-wrapper">
            <i class="fa-solid fa-globe"></i>
            <select id="langSelect" class="lang-select" onchange="onLanguageChange()">
                <option value="en">English (Voice / ASL)</option>
                <option value="ja">Japanese (Voice / JSL)</option>
            </select>
        </div>

        <button class="btn-ctrl btn-hangup" onclick="hangUp()"><i class="fa-solid fa-phone-slash"></i></button>
    </div>

    <script>
        const myId = localStorage.getItem('missvoice_id');
        const urlParams = new URLSearchParams(window.location.search);
        const peerId = urlParams.get('peer');

        if (!myId) {
            window.location.href = 'login.html';
        }

        document.getElementById('localLabel').innerText = `You (${myId})`;
        document.getElementById('remoteLabel').innerText = `Peer (${peerId || 'Waiting...'})`;

        let localStream = null;
        let peerConnection = null;
        let ws = null;
        let signInterval = null;
        let isSignActive = false;
        let isSendingFrame = false;
        let currentLanguage = 'en';
        let speechRecognition = null;
        let shouldListen = true;
        const candidateQueue = [];

        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ] 
        };

        function onLanguageChange() {
            currentLanguage = document.getElementById('langSelect').value;
            console.log("[Language Changed]:", currentLanguage);
            if (!isSignActive) {
                restartSpeechToText();
            }
        }

        /* =================== CONTINUOUS SPEECH RECOGNITION =================== */
        function initSpeechToText() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                console.warn("[STT] Web Speech API not supported.");
                return;
            }

            if (speechRecognition) {
                try { speechRecognition.abort(); } catch(e){}
            }

            speechRecognition = new SpeechRec();
            speechRecognition.continuous = true;
            speechRecognition.interimResults = false;
            speechRecognition.lang = (currentLanguage === 'ja') ? 'ja-JP' : 'en-US';

            speechRecognition.onresult = async (event) => {
                if (isSignActive) return;

                // Process every newly received speech result
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const transcript = event.results[i][0].transcript.trim();
                        if (transcript.length > 0) {
                            console.log("[STT Recognized]:", transcript);
                            handleSpokenText(transcript);
                        }
                    }
                }
            };

            speechRecognition.onerror = (e) => {
                if (e.error !== 'no-speech') {
                    console.warn("[STT Event Error]:", e.error);
                }
            };

            speechRecognition.onend = () => {
                // Instantly revive speech recognition if Voice Mode is active
                if (shouldListen && !isSignActive) {
                    setTimeout(() => {
                        try { speechRecognition.start(); } catch(e){}
                    }, 100);
                }
            };

            try {
                speechRecognition.start();
                console.log("[STT] Continuous listening activated for", speechRecognition.lang);
            } catch(e) {}
        }

        async function handleSpokenText(text) {
            try {
                const res = await fetch('/api/translate/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: text, 
                        source_lang: currentLanguage 
                    })
                });
                const data = await res.json();
                
                if (data.local_text) {
                    showSubtitle('localCaption', data.local_text);

                    if (peerId && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'sign_caption',
                            target: peerId,
                            sender: myId,
                            word: data.remote_text,
                            language: data.target_lang
                        }));
                    }
                }
            } catch (err) {
                console.error("[Translation Fetch Error]:", err);
            }
        }

        function restartSpeechToText() {
            shouldListen = false;
            if (speechRecognition) {
                try { speechRecognition.abort(); } catch(e){}
            }
            setTimeout(() => {
                shouldListen = true;
                initSpeechToText();
            }, 200);
        }

        /* =================== WEBRTC & SIGNALING =================== */
        async function initCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(rtcConfig);

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.ontrack = (event) => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        document.getElementById('remoteLabel').innerText = `Peer (${peerId || 'Connected'})`;
                    }
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && peerId && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ 
                            type: 'candidate', 
                            target: peerId, 
                            sender: myId, 
                            candidate: event.candidate 
                        }));
                    }
                };

                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/${encodeURIComponent(myId)}`);

                ws.onopen = async () => {
                    console.log("[WS] Connected as", myId);
                    ws.send(JSON.stringify({ type: 'ready', target: peerId, sender: myId }));

                    if (peerId && myId < peerId) {
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        ws.send(JSON.stringify({ type: 'offer', target: peerId, sender: myId, offer }));
                    }
                };

                ws.onmessage = async (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        if (data.type === 'ready' && myId < peerId) {
                            const offer = await peerConnection.createOffer();
                            await peerConnection.setLocalDescription(offer);
                            ws.send(JSON.stringify({ type: 'offer', target: peerId, sender: myId, offer }));
                        }
                        else if (data.type === 'offer') {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                            while (candidateQueue.length > 0) {
                                await peerConnection.addIceCandidate(new RTCIceCandidate(candidateQueue.shift()));
                            }
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);
                            ws.send(JSON.stringify({ type: 'answer', target: data.sender, sender: myId, answer }));
                        } 
                        else if (data.type === 'answer') {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                            while (candidateQueue.length > 0) {
                                await peerConnection.addIceCandidate(new RTCIceCandidate(candidateQueue.shift()));
                            }
                        } 
                        else if (data.type === 'candidate') {
                            if (peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                            } else {
                                candidateQueue.push(data.candidate);
                            }
                        }
                        else if (data.type === 'sign_caption') {
                            showSubtitle('remoteCaption', data.word);
                            speakText(data.word, data.language || 'en');
                        }
                    } catch (e) {
                        console.error("[WS Message Error]:", e);
                    }
                };

                initSpeechToText();

            } catch (err) {
                console.error("[Call Init Error]:", err);
                alert("Camera/Mic Error: " + err.message);
            }
        }

        /* =================== SIGN / VOICE TOGGLE =================== */
        function toggleSignRecognition() {
            isSignActive = !isSignActive;
            const btn = document.getElementById('signBtn');
            const txt = document.getElementById('signText');
            const badge = document.getElementById('modeBadge');

            if (isSignActive) {
                shouldListen = false;
                if (speechRecognition) {
                    try { speechRecognition.abort(); } catch(e){}
                }

                btn.classList.add('active');
                txt.innerText = 'SIGN: ON';
                badge.innerText = 'SIGN DETECTION ACTIVE';
                badge.style.color = '#38BDF8';
                badge.style.borderColor = '#38BDF8';
                badge.style.background = 'rgba(56, 189, 248, 0.2)';

                startSignProcessing();
            } else {
                if (signInterval) clearInterval(signInterval);
                isSendingFrame = false;

                btn.classList.remove('active');
                txt.innerText = 'SIGN: OFF';
                badge.innerText = 'VOICE / STT ACTIVE';
                badge.style.color = '#10B981';
                badge.style.borderColor = '#10B981';
                badge.style.background = 'rgba(16, 185, 129, 0.2)';

                shouldListen = true;
                initSpeechToText();
            }
        }

        function startSignProcessing() {
            const video = document.getElementById('localVideo');
            const canvas = document.getElementById('signCanvas');
            const ctx = canvas.getContext('2d');

            if (signInterval) clearInterval(signInterval);

            signInterval = setInterval(async () => {
                if (!isSignActive || isSendingFrame || !video.videoWidth) return;

                isSendingFrame = true;
                canvas.width = 320;
                canvas.height = 240;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const base64Data = canvas.toDataURL('image/jpeg', 0.55).split(',')[1];

                try {
                    const res = await fetch('/api/translate/frame', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            frame: base64Data,
                            language: currentLanguage 
                        })
                    });
                    const result = await res.json();
                    
                    const localText = result.local_text || result.detected_sign;
                    const remoteText = result.remote_text || localText;
                    const targetLang = result.target_lang || (currentLanguage === 'ja' ? 'en' : 'ja');

                    if (localText && localText !== 'None' && localText.trim() !== '') {
                        showSubtitle('localCaption', localText);
                        
                        if (peerId && ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: 'sign_caption',
                                target: peerId,
                                sender: myId,
                                word: remoteText,
                                language: targetLang
                            }));
                        }
                    }
                } catch (err) {
                    console.error("[Frame Inference Error]:", err);
                } finally {
                    isSendingFrame = false;
                }
            }, 250);
        }

        function showSubtitle(elementId, text) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.style.display = 'block';
            clearTimeout(el.timer);
            el.timer = setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function speakText(text, lang = 'en') {
            if (!('speechSynthesis' in window)) return;
            
            // Cancel current speech queue to prevent backlog
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = (lang === 'ja' || lang === 'ja-JP') ? 'ja-JP' : 'en-US';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function toggleMic() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('micBtn').innerHTML = audioTrack.enabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
            }
        }

        function toggleCam() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                document.getElementById('camBtn').innerHTML = videoTrack.enabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
            }
        }

        function hangUp() {
            shouldListen = false;
            if (speechRecognition) try { speechRecognition.abort(); } catch(e){}
            if (signInterval) clearInterval(signInterval);
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            if (ws) ws.close();
            window.location.href = 'dashboard.html';
        }

        initCall();
    </script>
</body>
</html>
