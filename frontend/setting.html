<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings — MissVoice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --border-color: #334155;
            --accent: #38BDF8;
            --success: #10B981;
            --danger: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        aside {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .logo i { color: var(--accent); }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.8rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .nav-item.active a, .nav-item a:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        main {
            margin-left: 260px;
            flex: 1;
            padding: 2.5rem;
            max-width: 700px;
        }

        .settings-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            background: #0F172A;
            border: 1px solid var(--border-color);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .form-group input:disabled {
            background: #182234;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-save {
            background: var(--accent);
            color: #0F172A;
            border: none;
            padding: 0.85rem 1.75rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-save:hover { opacity: 0.9; }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.85rem 1.75rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .status-msg {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 600;
            display: none;
        }
        .status-msg.success { background: rgba(16, 185, 129, 0.2); color: var(--success); display: block; }
        .status-msg.error { background: rgba(239, 68, 68, 0.2); color: var(--danger); display: block; }
    </style>
</head>
<body>
    <aside>
        <a href="dashboard.html" class="logo"><i class="fa-solid fa-hands-asl-interpreting"></i> MISSVOICE</a>
        <ul class="nav-menu">
    <li class="nav-item"><a href="dashboard.html"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
    <li class="nav-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search User</a></li>
    <li class="nav-item"><a href="connection.html"><i class="fa-solid fa-user-group"></i> Connections</a></li>
    <li class="nav-item"><a href="chat.html"><i class="fa-solid fa-comments"></i> Messages</a></li>
    <li class="nav-item"><a href="translate.html"><i class="fa-solid fa-hands"></i> Test AI Sign</a></li>
    <li class="nav-item"><a href="setting.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
</ul>
    </aside>

    <main>
        <h1 style="margin-bottom: 1.5rem;">Account Settings</h1>

        <div id="statusAlert" class="status-msg"></div>

        <form id="settingsForm" class="settings-card">
            <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">Profile Information</h3>
            
            <div class="form-group">
                <label>MissVoice ID (Permanent)</label>
                <input type="text" id="missvoiceIdInput" disabled />
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="nameInput" placeholder="Enter your full name" required />
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" placeholder="Enter your email address" required />
            </div>

            <h3 style="margin: 2rem 0 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">Change Password</h3>

            <div class="form-group">
                <label>New Password (Leave blank to keep current)</label>
                <input type="password" id="passwordInput" placeholder="Enter new password" />
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;">
                <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                <button type="button" class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
            </div>
        </form>
    </main>

    <script>
        const myId = localStorage.getItem('missvoice_id');
        if (!myId) window.location.href = 'login.html';

        document.getElementById('missvoiceIdInput').value = myId;

        // Load existing user profile
        async function loadProfile() {
            try {
                const res = await fetch(`/api/users/${encodeURIComponent(myId)}`);
                if (!res.ok) return;
                const user = await res.json();
                document.getElementById('nameInput').value = user.name || '';
                document.getElementById('emailInput').value = user.email || '';
            } catch (err) {
                console.error("Error loading user profile:", err);
            }
        }

        // Save profile changes
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('statusAlert');
            alertBox.className = 'status-msg';

            const payload = {
                missvoice_id: myId,
                name: document.getElementById('nameInput').value,
                email: document.getElementById('emailInput').value
            };

            const newPwd = document.getElementById('passwordInput').value;
            if (newPwd.trim()) {
                payload.password = newPwd.trim();
            }

            try {
                const res = await fetch('/api/users/profile/update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alertBox.innerText = 'Profile updated successfully!';
                    alertBox.className = 'status-msg success';
                    document.getElementById('passwordInput').value = '';
                } else {
                    alertBox.innerText = data.detail || 'Failed to update profile';
                    alertBox.className = 'status-msg error';
                }
            } catch (err) {
                alertBox.innerText = 'Network error while updating profile';
                alertBox.className = 'status-msg error';
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        loadProfile();
    </script>
</body>
</html>
